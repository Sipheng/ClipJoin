<script type="module">
import { FFmpeg } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
import { toBlobURL } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js';

const $ = id => document.getElementById(id);
const urlsEl = $('urls'), startBtn = $('start'), clearBtn = $('clear');
let ffmpeg = null, outputUrl = null, busy = false;

function getUrls() {
  return [...new Set(urlsEl.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean))];
}
function updateCount() {
  const n = getUrls().length;
  $('count').textContent = `${n} link${n === 1 ? '' : 's'}`;
}
urlsEl.addEventListener('input', updateCount);
clearBtn.addEventListener('click', () => {
  if (busy) return;
  urlsEl.value = ''; updateCount(); $('queue').replaceChildren();
  $('status').classList.remove('show'); $('result').classList.remove('show');
  if (outputUrl) URL.revokeObjectURL(outputUrl);
  outputUrl = null;
});

function setProgress(percent, phase, detail='') {
  const p = Math.max(0, Math.min(100, Math.round(percent)));
  $('status').classList.add('show');
  $('fill').style.width = p + '%'; $('percent').textContent = p + '%';
  $('phase').textContent = phase; $('detail').textContent = detail;
}
function safeName(i, ext) { return `input_${String(i).padStart(3,'0')}.${ext}`; }
function setItemState(index, text, cls='') {
  const el = $('queue').querySelector(`[data-index="${index}"] .state`);
  if (el) { el.textContent = text; el.className = 'state ' + cls; }
}

async function loadEngine() {
  if (ffmpeg) return;
  setProgress(2, 'Loading video engine', 'First use may take a little while because FFmpeg is downloaded into your browser.');
  ffmpeg = new FFmpeg();
  ffmpeg.on('progress', ({ progress }) => {
    setProgress(85 + Math.max(0, Math.min(1, progress)) * 14, 'Merging videos', 'Combining clips in the order provided…');
  });
  const base = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd';
  await ffmpeg.load({
    coreURL: await toBlobURL(`${base}/ffmpeg-core.js`, 'text/javascript'),
    wasmURL: await toBlobURL(`${base}/ffmpeg-core.wasm`, 'application/wasm')
  });
}

async function fetchVideo(url, index, total) {
  let targetUrl = url;

  // 1. If it's a watch page link, route it through our Cloudflare Worker extractor first
  if (!url.includes('.mp4') && !url.includes('.webm')) {
    setProgress(5 + (index / total) * 30, `Resolving link ${index+1} of ${total}`, 'Bypassing restrictions and finding direct video stream...');
    try {
      const res = await fetch('/api/extract', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || 'Could not resolve stream.');
      targetUrl = data.directUrl;
    } catch (err) {
      throw new Error(`Extraction failed: ${err.message}`);
    }
  }

  // 2. Download the resolved direct media stream chunk-by-chunk
  let response;
  try { response = await fetch(targetUrl, { mode: 'cors' }); }
  catch (e) { throw new Error('Could not access direct stream URL due to network or CORS policy.'); }
  
  if (!response.ok) throw new Error(`Download failed (HTTP ${response.status}).`);
  
  const reader = response.body?.getReader();
  let chunks = [], received = 0;
  const totalBytes = Number(response.headers.get('content-length')) || 0;
  
  if (reader) {
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      chunks.push(value); received += value.byteLength;
      if (totalBytes) {
        setProgress(35 + (index / total) * 35 + (received / totalBytes) * (35 / total), 
          `Downloading video ${index+1} of ${total}`, 
          `${(received/1048576).toFixed(1)} MB received`
        );
      }
    }
  } else {
    const blob = await response.blob(); 
    chunks = [new Uint8Array(await blob.arrayBuffer())]; 
    received = blob.size;
  }
  
  const bytes = new Uint8Array(received); let offset = 0;
  for (const chunk of chunks) { bytes.set(chunk, offset); offset += chunk.byteLength; }
  if (!bytes.length) throw new Error('The downloaded video file is empty.');
  
  return { name: safeName(index+1, 'mp4'), bytes };
}

startBtn.addEventListener('click', async () => {
  if (busy) return;
  const urls = getUrls();
  if (!urls.length) { alert('Paste at least one video link.'); return; }
  
  busy = true; startBtn.disabled = true; clearBtn.disabled = true;
  $('result').classList.remove('show');
  if (outputUrl) URL.revokeObjectURL(outputUrl);
  
  $('queue').innerHTML = urls.map((u,i) => `<div class="item" data-index="${i}"><span class="num">${i+1}</span><span class="url" title="${u.replaceAll('"','&quot;')}">${u.replaceAll('<','&lt;')}</span><span class="state">Waiting</span></div>`).join('');
  
  try {
    const files = [];
    for (let i=0; i<urls.length; i++) {
      setItemState(i, 'Processing…');
      const file = await fetchVideo(urls[i], i, urls.length);
      files.push(file); 
      setItemState(i, 'Downloaded', 'ok');
    }
    
    await loadEngine();
    setProgress(72, 'Preparing files', 'Moving downloaded clips into the local WebAssembly workspace…');
    
    const listLines = [];
    for (const file of files) {
      await ffmpeg.writeFile(file.name, file.bytes);
      listLines.push(`file '${file.name}'`);
    }
    await ffmpeg.writeFile('concat-list.txt', new TextEncoder().encode(listLines.join('\n')));
    
    setProgress(85, 'Merging videos', 'Stitching video segments together losslessly…');
    let code = await ffmpeg.exec(['-f','concat','-safe','0','-i','concat-list.txt','-c','copy','-movflags','+faststart','combined.mp4']);
    
    if (code !== 0) {
      setProgress(85, 'Re-encoding videos', 'The clips have mismatched specs. Re-encoding frames...');
      code = await ffmpeg.exec(['-f','concat','-safe','0','-i','concat-list.txt','-c:v','libx264','-preset','ultrafast','-crf','23','-c:a','aac','-b:a','192k','-movflags','+faststart','combined.mp4']);
    }
    
    if (code !== 0) throw new Error('FFmpeg could not combine these files. Incompatible formats.');
    
    const data = await ffmpeg.readFile('combined.mp4');
    const blob = new Blob([data], {type:'video/mp4'});
    outputUrl = URL.createObjectURL(blob);
    
    $('download').href = outputUrl;
    $('resultInfo').textContent = `Combined ${files.length} video${files.length===1?'':'s'} · ${(blob.size/1048576).toFixed(1)} MB`;
    $('result').classList.add('show');
    setProgress(100, 'Completed', 'Your combined MP4 is ready to download.');
  } catch (err) {
    console.error(err);
    setProgress(0, 'Could not finish', err?.message || 'An unexpected error occurred.');
    alert(`Video merge failed:\n${err?.message || err}`);
  } finally {
    busy = false; startBtn.disabled = false; clearBtn.disabled = false;
  }
});
updateCount();
</script>
