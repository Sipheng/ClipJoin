<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipJoin - Video Concatenator</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 40px 20px; }
    .card { background: #1e293b; padding: 24px; border-radius: 12px; max-width: 600px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { margin-top: 0; color: #38bdf8; }
    textarea { width: 100%; height: 120px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 12px; font-family: monospace; box-sizing: border-box; resize: vertical; }
    button { width: 100%; margin-top: 12px; padding: 12px; background: #0284c7; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #downloadBtn { background: #16a34a; display: none; text-align: center; text-decoration: none; display: block; margin-top: 12px; }
    .progress-box { margin-top: 16px; display: none; }
    progress { width: 100%; height: 12px; }
    .status { font-size: 0.9em; color: #94a3b8; margin-bottom: 6px; }
  </style>
  <!-- Load FFmpeg WebAssembly -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
</head>
<body>
  <div class="card">
    <h1>ClipJoin</h1>
    <p style="color: #94a3b8;">Paste your video URLs line by line. ClipJoin extracts the direct video streams, merges them, and generates a single download file.</p>
    
    <textarea id="urlList" placeholder="https://reelfren.net/watch/pinedrama/...ep=1&#10;https://reelfren.net/watch/pinedrama/...ep=2"></textarea>
    
    <button id="processBtn" onclick="startJoinProcess()">Join & Merge Videos</button>
    
    <div class="progress-box" id="progressBox">
      <div class="status" id="statusLabel">Preparing execution environment...</div>
      <progress id="progressBar" value="0" max="100"></progress>
    </div>

    <a id="downloadBtn" download="ClipJoin_Combined.mp4" style="display:none;">Download Combined Video</a>
  </div>

  <script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ log: true });

    async function startJoinProcess() {
      const rawText = document.getElementById('urlList').value.trim();
      if (!rawText) return alert("Please paste at least one video URL.");
      
      const urls = rawText.split('\n').map(u => u.trim()).filter(u => u.length > 0);
      const btn = document.getElementById('processBtn');
      const progressBox = document.getElementById('progressBox');
      const statusLabel = document.getElementById('statusLabel');
      const progressBar = document.getElementById('progressBar');
      const downloadBtn = document.getElementById('downloadBtn');

      btn.disabled = true;
      progressBox.style.display = "block";
      downloadBtn.style.display = "none";
      progressBar.value = 0;

      try {
        const resolvedDirectUrls = [];

        // 1. Resolve URLs via Cloudflare Worker
        for (let i = 0; i < urls.length; i++) {
          statusLabel.innerText = `Resolving video stream URL (${i + 1}/${urls.length})...`;
          const res = await fetch('/api/extract', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: urls[i] })
          });
          const data = await res.json();
          if (!data.success) throw new Error(`Link #${i+1} failed: ${data.error}`);
          resolvedDirectUrls.push(data.directUrl);
          progressBar.value = ((i + 1) / urls.length) * 30;
        }

        // 2. Initialize In-Browser WebAssembly FFmpeg
        if (!ffmpeg.isLoaded()) {
          statusLabel.innerText = "Initializing in-browser video processing engine...";
          await ffmpeg.load();
        }

        // 3. Load files into WASM virtual filesystem
        let manifestContent = '';
        for (let i = 0; i < resolvedDirectUrls.length; i++) {
          statusLabel.innerText = `Fetching video segment (${i + 1}/${resolvedDirectUrls.length})...`;
          const videoData = await fetchFile(resolvedDirectUrls[i]);
          const fileName = `part${i}.mp4`;
          ffmpeg.FS('writeFile', fileName, videoData);
          manifestContent += `file '${fileName}'\n`;
          progressBar.value = 30 + (((i + 1) / resolvedDirectUrls.length) * 40);
        }

        ffmpeg.FS('writeFile', 'concat.txt', manifestContent);

        // 4. Perform Lossless Stream Concatenation
        statusLabel.innerText = "Stitching video segments into 1 file...";
        await ffmpeg.run('-f', 'concat', '-safe', '0', '-i', 'concat.txt', '-c', 'copy', 'joined_output.mp4');
        progressBar.value = 95;

        // 5. Read output blob & generate download button link
        const data = ffmpeg.FS('readFile', 'joined_output.mp4');
        const videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
        const videoUrl = URL.createObjectURL(videoBlob);

        downloadBtn.href = videoUrl;
        downloadBtn.style.display = "block";
        statusLabel.innerText = "Processing Complete! Your joined video is ready for download.";
        progressBar.value = 100;

      } catch (err) {
        alert(`ClipJoin Error: ${err.message}`);
        statusLabel.innerText = "Error encountered during processing.";
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
